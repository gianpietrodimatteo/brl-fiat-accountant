services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    environment:
      PORT: ${BACKEND_PORT:-3001}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/data/app.db}
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      PORT: ${FRONTEND_PORT:-3000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
